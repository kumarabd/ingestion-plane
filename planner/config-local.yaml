# Planner Local Configuration
# This configuration is for local development and testing

# Server configuration
server:
  http_addr: ":8080"
  read_timeout: "5s"
  write_timeout: "10s"

# Database configuration (PostgreSQL)
# For local development, connect to localhost
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  database: "ingestion_plane"
  ssl_mode: "disable"

# Vector database configuration (Qdrant)
# For local development, connect to localhost
vector:
  host: "localhost"
  port: 6334
  collection: "templates"
  vector_dim: 384

# Service configuration
service:
  tenant: "default"
  default_topk: 10          # Default number of results to return
  max_templates_in_plan: 8  # Maximum templates to include in a plan

