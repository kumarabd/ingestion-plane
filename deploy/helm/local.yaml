# Gateway Service (Go)
gateway:
  enabled: true
  replicaCount: 1
  image:
    tag: "arm64"

# Miner Service (Python/Drain3)
miner:
  enabled: true
  replicaCount: 1
  image:
    tag: "arm64"
  
# Sampler Service (Go)
sampler:
  enabled: true
  replicaCount: 1
  
  image:
    tag: "arm64"
 
# IndexFeed Service (Go)
indexfeed:
  enabled: true
  replicaCount: 1
  
  image:
    tag: "arm64"
  
# Planner Service (Go)
planner:
  enabled: true
  replicaCount: 1
  
  image:
    tag: "arm64"
  
# PostgreSQL (Bitnami) - for IndexFeed metadata
postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: ingestion_plane
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  # Bitnami PostgreSQL metrics
  metrics:
    enabled: false

# Redis (Bitnami) - for caching and state
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 125m
        memory: 64Mi
  # Bitnami Redis metrics
  metrics:
    enabled: false

# Qdrant - for vector storage
qdrant:
  enabled: true
  replicaCount: 1
  image:
    repository: qdrant/qdrant
    tag: v1.7.4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334
  persistence:
    enabled: true
    size: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi
