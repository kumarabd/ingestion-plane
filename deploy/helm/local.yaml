# Default values for ingestion-plane
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Gateway Service (Go)
gateway:
  enabled: true
  replicaCount: 2
  
  image:
    repository: ghcr.io/kumarabd/ingestion-plane/gateway
    pullPolicy: IfNotPresent
    tag: "arm64"
  
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 9090
    annotations: {}
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
  affinity: {}
  
  # Gateway configuration
  config:
    server:
      http:
        host: "0.0.0.0"
        port: "8080"
        read_timeout: "30s"
        write_timeout: "30s"
        idle_timeout: "60s"
      grpc:
        host: "0.0.0.0"
        port: "9090"
        max_concurrent_streams: 100
    
    otlp:
      max_log_size: 1048576
      max_message_bytes: 1048576
      max_batch_size: 1000
      request_timeout: "30s"
    
    miner:
      timeout: "200ms"
      max_batch: 500
      max_batch_wait: "25ms"
      shadow_only: true
    
    sampler:
      timeout: "100ms"
      max_batch: 1000
      max_batch_wait: "25ms"

# Miner Service (Python/Drain3)
miner:
  enabled: true
  replicaCount: 2
  
  image:
    repository: ghcr.io/kumarabd/ingestion-plane/miner
    pullPolicy: IfNotPresent
    tag: "arm64"
  
  service:
    type: ClusterIP
    grpcPort: 50051
    annotations: {}
  
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  env:
    drainSimThreshold: "0.4"
    drainMaxDepth: "4"
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Sampler Service (Go)
sampler:
  enabled: true
  replicaCount: 2
  
  image:
    repository: ghcr.io/kumarabd/ingestion-plane/sampler
    pullPolicy: IfNotPresent
    tag: "arm64"
  
  service:
    type: ClusterIP
    grpcPort: 50060
    annotations: {}
  
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 64Mi
  
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# IndexFeed Service (Go)
indexfeed:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/kumarabd/ingestion-plane/indexfeed
    pullPolicy: IfNotPresent
    tag: "arm64"
  
  service:
    type: ClusterIP
    grpcPort: 50070
    annotations: {}
  
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 64Mi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Planner Service (Go)
planner:
  enabled: true
  replicaCount: 1
  
  image:
    repository: ghcr.io/kumarabd/ingestion-plane/planner
    pullPolicy: IfNotPresent
    tag: "arm64"
  
  service:
    type: ClusterIP
    grpcPort: 50080
    annotations: {}
  
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 125m
      memory: 64Mi
  
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  
  nodeSelector: {}
  tolerations: []
  affinity: {}

# PostgreSQL (Bitnami) - for IndexFeed metadata
postgresql:
  enabled: true
  auth:
    username: postgres
    password: postgres
    database: ingestion_plane
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 250m
        memory: 256Mi
  # Bitnami PostgreSQL metrics
  metrics:
    enabled: false

# Redis (Bitnami) - for caching and state
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 125m
        memory: 64Mi
  # Bitnami Redis metrics
  metrics:
    enabled: false

# Qdrant - for vector storage
qdrant:
  enabled: true
  replicaCount: 1
  image:
    repository: qdrant/qdrant
    tag: v1.7.4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334
  persistence:
    enabled: true
    size: 20Gi
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 1Gi

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: ingestion-plane.example.com
      paths:
        - path: /
          pathType: Prefix
          serviceName: gateway
          servicePort: 8080
  tls: []
  #  - secretName: ingestion-plane-tls
  #    hosts:
  #      - ingestion-plane.example.com

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod Security Context
podSecurityContext:
  fsGroup: 2000

# Security Context
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

