---
{{- if .Values.indexfeed.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ingestion-plane.fullname" . }}-indexfeed
  labels:
    {{- include "ingestion-plane.indexfeed.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ingestion-plane.fullname" . }}-indexfeed
  minReplicas: {{ .Values.indexfeed.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.indexfeed.autoscaling.maxReplicas }}
  metrics:
  {{- if .Values.indexfeed.autoscaling.targetCPUUtilizationPercentage }}
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.indexfeed.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
{{- end }}