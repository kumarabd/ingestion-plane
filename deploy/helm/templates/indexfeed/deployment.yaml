{{- if .Values.indexfeed.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestion-plane.fullname" . }}-indexfeed
  labels:
    {{- include "ingestion-plane.indexfeed.labels" . | nindent 4 }}
spec:
  {{- if not .Values.indexfeed.autoscaling.enabled }}
  replicas: {{ .Values.indexfeed.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ingestion-plane.indexfeed.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/indexfeed/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ingestion-plane.indexfeed.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "ingestion-plane.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ingestion-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: indexfeed
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.indexfeed.image.repository }}:{{ .Values.indexfeed.image.tag }}"
        imagePullPolicy: {{ .Values.indexfeed.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.indexfeed.service.grpcPort }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.indexfeed.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ingestion-plane.fullname" . }}-indexfeed-config
      {{- with .Values.indexfeed.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexfeed.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.indexfeed.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

