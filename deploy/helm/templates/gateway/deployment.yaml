{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestion-plane.fullname" . }}-gateway
  labels:
    {{- include "ingestion-plane.gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ingestion-plane.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ingestion-plane.gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "ingestion-plane.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ingestion-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: gateway
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.gateway.service.httpPort }}
          protocol: TCP
        - name: grpc
          containerPort: {{ .Values.gateway.service.grpcPort }}
          protocol: TCP
        env:
        - name: MINER_ADDR
          value: "{{ include "ingestion-plane.fullname" . }}-miner:{{ .Values.miner.service.grpcPort }}"
        - name: SAMPLER_ADDR
          value: "{{ include "ingestion-plane.fullname" . }}-sampler:{{ .Values.sampler.service.grpcPort }}"
        - name: INDEXFEED_ADDR
          value: "{{ include "ingestion-plane.fullname" . }}-indexfeed:{{ .Values.indexfeed.service.grpcPort }}"
        - name: REDIS_URL
          value: "redis://{{ include "ingestion-plane.redis.host" . }}:6379"
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ingestion-plane.fullname" . }}-gateway-config
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

