{{- if .Values.planner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestion-plane.fullname" . }}-planner
  labels:
    {{- include "ingestion-plane.planner.labels" . | nindent 4 }}
spec:
  {{- if not .Values.planner.autoscaling.enabled }}
  replicas: {{ .Values.planner.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ingestion-plane.planner.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/planner/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "ingestion-plane.planner.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "ingestion-plane.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ingestion-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: planner
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.planner.image.repository }}:{{ .Values.planner.image.tag }}"
        imagePullPolicy: {{ .Values.planner.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.planner.service.httpPort }}
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /app/config.yaml
          subPath: config.yaml
          readOnly: true
        livenessProbe:
          httpGet:
            path: /v1/search
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /v1/search
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.planner.resources | nindent 10 }}
      volumes:
      - name: config
        configMap:
          name: {{ include "ingestion-plane.fullname" . }}-planner-config
      {{- with .Values.planner.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.planner.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

