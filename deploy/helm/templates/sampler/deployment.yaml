{{- if .Values.sampler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingestion-plane.fullname" . }}-sampler
  labels:
    {{- include "ingestion-plane.sampler.labels" . | nindent 4 }}
spec:
  {{- if not .Values.sampler.autoscaling.enabled }}
  replicas: {{ .Values.sampler.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ingestion-plane.sampler.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ingestion-plane.sampler.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "ingestion-plane.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "ingestion-plane.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: sampler
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.sampler.image.repository }}:{{ .Values.sampler.image.tag }}"
        imagePullPolicy: {{ .Values.sampler.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.sampler.service.grpcPort }}
          protocol: TCP
        env:
        - name: REDIS_URL
          value: "redis://{{ include "ingestion-plane.redis.host" . }}:6379"
        - name: GRPC_PORT
          value: {{ .Values.sampler.service.grpcPort | quote }}
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          {{- toYaml .Values.sampler.resources | nindent 10 }}
      {{- with .Values.sampler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sampler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sampler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

