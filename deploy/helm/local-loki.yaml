# Loki Helm Chart Override - Processed Logs
# For local/development deployment

# Use unique names to avoid conflicts with loki-raw
fullnameOverride: "loki"
nameOverride: "loki"

# Single instance deployment - all components in one pod
deploymentMode: SingleBinary

# Disable other deployment modes
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
    ring:
      kvstore:
        store: inmemory  # Use in-memory instead of memberlist for single instance
  
  storage:
    type: 'filesystem'
  
  schemaConfig:
    configs:
      - from: 2024-01-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  
  # Minimal limits - no retention (infinite)
  limits_config:
    allow_structured_metadata: false  # Disable to avoid schema complexity
    reject_old_samples: false
    unordered_writes: true
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20

# Service account for Loki processed logs
serviceAccount:
  create: true
  name: loki-processed
  annotations: {}

# Disable memberlist service (not needed for single instance)
memberlist:
  enabled: false

# Single binary mode - all components in one pod
singleBinary:
  replicas: 1
  
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

# Disable all optional components for minimal setup
monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

# Explicitly disable canary service account
lokiCanary:
  enabled: false

# Disable gateway (nginx) - access Loki directly
gateway:
  enabled: false

# Disable chunks cache
chunksCache:
  enabled: false

# Disable results cache  
resultsCache:
  enabled: false

# Disable enterprise features
enterprise:
  enabled: false

# Disable test pods
test:
  enabled: false

# Disable ruler
ruler:
  enabled: false

# Disable index gateway
indexGateway:
  enabled: false

